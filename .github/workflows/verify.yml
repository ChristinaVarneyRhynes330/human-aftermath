name: Verify Build & Simulation Lab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify masterclass reference
        run: node scripts/verify-masterclass.mjs
      - name: Validate Lab Scenarios Graph
        run: npm run validate:lab
      - name: Next.js Build & Typecheck
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ewstocrowfguphxwqxjt.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock
          CREDENTIAL_SALT: test-salt-env-variable
